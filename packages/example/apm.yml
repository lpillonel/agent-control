name: example
version: 0.1.0
description: Minimal example skill, proving the agent-control -> agent-marketplace publish pipeline end to end.
license: LicenseRef-IMTF-Proprietary

targets:
  - claude
  - codex

includes: auto

# This version is for `apm install` fidelity only -- the marketplace version
# published to agent-marketplace is calendar-based and derived from git tags
# by scripts/publish.py, not from this field.

dependencies:
  apm:
    # mattpocock/skills (MIT) — requirement extraction before planning:
    - mattpocock/skills/skills/productivity/grill-me#6acc160e4e0cd062dbbbd7a1b26ae92855edf07e # v1.2.3

scripts:
  # Resolve dependencies + record provenance, then pack a self-contained
  # bundle (plugin.json + skills/, own skill and every resolved dependency
  # flattened in). The bundle needs no apm.yml and no network to install --
  # it's a plain plugin.json + skills/ directory Claude/Codex load natively.
  pack: "apm install --frozen && apm pack --format agent-plugin -o build --archive --force"
